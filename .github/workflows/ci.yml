name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    # Past 30 minutes a leg is hung; without a cap it bills to the 6-hour
    # default.
    timeout-minutes: 30
    strategy:
      # One OS failing almost always means the other repeats it - stop the
      # 2x-billing Windows leg instead of letting both run to completion.
      fail-fast: true
      matrix:
        # macOS bills at 10x and release.yml already builds the Darwin
        # binaries, so per-push/PR CI doesn't need it (the same trade
        # SwarmIO's ci.yml documents).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No separate build step: cargo test compiles every target anyway, so a
      # build step first would just pay the link cost twice.
      - name: Test
        run: cargo test --workspace --locked
